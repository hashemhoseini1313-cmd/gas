name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install SDL2 system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev

    - name: Install dependencies
      run: |
        sudo apt update -o Acquire::Retries=3
        sudo apt install -y --no-install-recommends build-essential libffi-dev libssl-dev ccache git unzip zip zlib1g-dev openjdk-17-jdk
        pip install --upgrade pip setuptools
        pip install Cython==0.29.36
        pip install buildozer==1.5.0

        python -m pip install --upgrade pip setuptools
        pip install --no-build-isolation \
          "cython==0.29.33" \
          "buildozer==1.5.0"

    # 👇 مرحلهٔ جدید: نصب Android SDK و پذیرش لایسنس‌ها
    - name: Install Android SDK and accept licenses
      run: |
        mkdir -p $HOME/android-sdk/cmdline-tools
        cd $HOME/android-sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools latest
        rm commandlinetools-linux-11076708_latest.zip

        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;33.0.2" "build-tools;34.0.0"

    # 👇 مرحلهٔ پاک‌سازی کش (مانند قبل)
    - name: Clean build cache
      run: |
        rm -rf .buildozer ~/.buildozer

    - name: Build with Buildozer
      env:
        ANDROID_HOME: /home/runner/android-sdk          # ✅ اضافه شد
        ANDROID_SDK_ROOT: /home/runner/android-sdk       # ✅ اضافه شد
        ANDROIDSDK: /home/runner/android-sdk             # ✅ اضافه شد
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
        ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/25.2.9519653
        PIP_NO_BUILD_ISOLATION: 1
      run: |
        buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
