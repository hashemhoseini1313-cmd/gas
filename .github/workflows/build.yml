name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10.12'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install SDL2 system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev

    - name: Install dependencies
      run: |
        sudo apt update -o Acquire::Retries=3
        sudo apt install -y --no-install-recommends \
          build-essential libffi-dev libssl-dev ccache git unzip zip zlib1g-dev openjdk-17-jdk

        python -m pip install --upgrade pip==23.1.2 setuptools
        pip install Cython==0.29.36
        pip install python-for-android==2024.01.21

    - name: Install Android SDK and accept licenses
      run: |
        mkdir -p $HOME/android-sdk/cmdline-tools
        cd $HOME/android-sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools latest
        rm commandlinetools-linux-11076708_latest.zip

        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

        mkdir -p $HOME/android-sdk/tools/bin
        ln -sf $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager $HOME/android-sdk/tools/bin/sdkmanager
        ln -sf $HOME/android-sdk/cmdline-tools/latest/bin/avdmanager $HOME/android-sdk/tools/bin/avdmanager

    - name: Clean build cache
      run: |
        rm -rf .buildozer ~/.buildozer ~/.cache/p4a

    - name: Download and install NDK r28c
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
        unzip -q android-ndk-r28c-linux.zip
        rm android-ndk-r28c-linux.zip
        mkdir -p $HOME/.buildozer/android/platform
        mv android-ndk-r28c $HOME/.buildozer/android/platform/android-ndk-r28c

    - name: Build with p4a (API 35)
      env:
        ANDROID_HOME: /home/runner/android-sdk
        ANDROID_SDK_ROOT: /home/runner/android-sdk
        ANDROID_NDK_HOME: /home/runner/.buildozer/android/platform/android-ndk-r28c
        ANDROID_NDK_ROOT: /home/runner/.buildozer/android/platform/android-ndk-r28c
      run: |
        p4a apk \
          --private . \
          --package=org.example.screenrecorder \
          --name "Screen Recorder" \
          --version 1.0 \
          --bootstrap=sdl2 \
          --requirements=python3==3.10.12,kivy==2.1.0,arabic_reshaper,python-bidi \
          --arch=arm64-v8a \
          --android-api=35 \
          --ndk-api=35 \
          --sdk-dir=/home/runner/android-sdk \
          --ndk-dir=/home/runner/.buildozer/android/platform/android-ndk-r28c \
          --dist-name=screenrecorder \
          --permission INTERNET \
          --permission FOREGROUND_SERVICE \
          --permission FOREGROUND_SERVICE_MEDIA_PROJECTION \
          --permission RECORD_AUDIO \
          --permission WRITE_EXTERNAL_STORAGE \
          --permission READ_EXTERNAL_STORAGE \
          --permission READ_MEDIA_IMAGES \
          --permission READ_MEDIA_VIDEO \
          --permission POST_NOTIFICATIONS \
          --add-source=src \
          --manifest=manifest.xml

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
