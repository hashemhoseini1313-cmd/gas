name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install SDL2 system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev

    - name: Install dependencies
      run: |
        sudo apt update -o Acquire::Retries=3
        sudo apt install -y --no-install-recommends build-essential libffi-dev libssl-dev ccache git unzip zip zlib1g-dev openjdk-17-jdk
        pip install --upgrade pip setuptools
        pip install Cython==0.29.36
        pip install buildozer==1.5.0

    # 👇 نصب Android SDK و پذیرش لایسنس‌ها + نصب API 35 و NDK 25b
    - name: Install Android SDK, NDK and accept licenses
      run: |
        mkdir -p $HOME/android-sdk/cmdline-tools
        cd $HOME/android-sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools latest
        rm commandlinetools-linux-11076708_latest.zip

        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653"

        # لینک برای ساختار قدیمی SDK که Buildozer انتظار دارد
        mkdir -p $HOME/android-sdk/tools/bin
        ln -sf $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager $HOME/android-sdk/tools/bin/sdkmanager
        ln -sf $HOME/android-sdk/cmdline-tools/latest/bin/avdmanager $HOME/android-sdk/tools/bin/avdmanager

    # 👇 اصلاح خودکار buildozer.spec برای سازگاری با اندروید ۱۵ و رفع خطاها
    - name: Fix buildozer.spec
      run: |
        # تنظیم API و build-tools
        sed -i 's/^android.api = .*/android.api = 35/' buildozer.spec
        sed -i 's/^android.build_tools_version = .*/android.build_tools_version = 35.0.0/' buildozer.spec

        # حذف hostpython3 از requirements (خطا می‌دهد)
        sed -i 's/^requirements = .*/requirements = python3==3.10.12,kivy,arabic_reshaper,python-bidi/' buildozer.spec

        # کامنت کردن android.services (برای سرویس Java لازم نیست و خطا می‌دهد)
        sed -i 's/^android.services = .*/# android.services = ScreenCaptureService:org.example.screenrecorder.ScreenCaptureService/' buildozer.spec

        # اصلاح مسیر NDK به محل نصب‌شده در این workflow
        sed -i 's|^android.ndk_path = .*|android.ndk_path = /home/runner/android-sdk/ndk/25.2.9519653|' buildozer.spec

    # 👇 پاک‌سازی کش
    - name: Clean build cache
      run: |
        rm -rf .buildozer ~/.buildozer

    # 👇 حذف NDK اشتباه (28c) در صورت وجود
    - name: Remove wrong NDK version
      run: |
        rm -rf /home/runner/.buildozer/android/platform/android-ndk-r28c
        rm -rf /home/runner/.buildozer/android/platform/android-ndk-r28c-linux.zip

    # 👇 ساخت Symlink برای مسیر پیش‌فرض Buildozer (SDK)
    - name: Create SDK symlink for Buildozer
      run: |
        mkdir -p /home/runner/.buildozer/android/platform
        ln -sfn /home/runner/android-sdk /home/runner/.buildozer/android/platform/android-sdk

    # 👇 ساخت Symlink برای NDK (جلوگیری از دانلود مجدد NDK)
    - name: Create NDK symlink for Buildozer
      run: |
        mkdir -p /home/runner/.buildozer/android/platform
        ln -sfn /home/runner/android-sdk/ndk/25.2.9519653 /home/runner/.buildozer/android/platform/android-ndk-r25b

    - name: Build with Buildozer
      env:
        ANDROID_HOME: /home/runner/android-sdk
        ANDROID_SDK_ROOT: /home/runner/android-sdk
        ANDROIDSDK: /home/runner/android-sdk
        ANDROID_NDK_HOME: /home/runner/android-sdk/ndk/25.2.9519653
        ANDROID_NDK_ROOT: /home/runner/android-sdk/ndk/25.2.9519653
        PIP_NO_BUILD_ISOLATION: 1
      run: |
        buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
