name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10.12'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install SDL2 system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev

    - name: Install dependencies
      run: |
        sudo apt update -o Acquire::Retries=3
        sudo apt install -y --no-install-recommends build-essential libffi-dev libssl-dev ccache git unzip zip zlib1g-dev openjdk-17-jdk

        # نصب pip نسخه 23.1.2 (سازگار با python-for-android)
        python -m pip install --upgrade pip==23.1.2 setuptools

        # نصب Cython نسخه سازگار
        pip install Cython==0.29.36

        # نصب آخرین Buildozer از GitHub (پشتیبانی بهتر از Python 3.11)
        pip install git+https://github.com/kivy/buildozer.git@master

    # نصب Android SDK و پذیرش لایسنس‌ها
    - name: Install Android SDK and accept licenses
      run: |
        mkdir -p $HOME/android-sdk/cmdline-tools
        cd $HOME/android-sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools latest
        rm commandlinetools-linux-11076708_latest.zip

        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

        mkdir -p $HOME/android-sdk/tools/bin
        ln -sf $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager $HOME/android-sdk/tools/bin/sdkmanager
        ln -sf $HOME/android-sdk/cmdline-tools/latest/bin/avdmanager $HOME/android-sdk/tools/bin/avdmanager

    # پاک‌سازی کامل کش
    - name: Clean build cache
      run: |
        rm -rf .buildozer ~/.buildozer

    # دانلود NDK r25b و قرار دادن در مسیر پیش‌فرض Buildozer
    - name: Download and install NDK r25b
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        unzip -q android-ndk-r25b-linux.zip
        rm android-ndk-r25b-linux.zip
        mkdir -p /home/runner/.buildozer/android/platform
        mv android-ndk-r25b /home/runner/.buildozer/android/platform/android-ndk-r25b

    # ساخت symlink برای SDK
    - name: Create SDK symlink for Buildozer
      run: |
        mkdir -p /home/runner/.buildozer/android/platform
        ln -sfn /home/runner/android-sdk /home/runner/.buildozer/android/platform/android-sdk

    # نمایش محتوای buildozer.spec برای اطمینان از تنظیمات
    - name: Show buildozer.spec
      run: |
        cat buildozer.spec
        echo "--------------------"
        grep -E "android\.ndk|android\.ndk_api|android\.api|p4a\.ndk_api|requirements" buildozer.spec

    - name: Build with Buildozer
      env:
        ANDROID_HOME: /home/runner/android-sdk
        ANDROID_SDK_ROOT: /home/runner/android-sdk
        ANDROIDSDK: /home/runner/android-sdk
        ANDROID_NDK_HOME: /home/runner/.buildozer/android/platform/android-ndk-r25b
        ANDROID_NDK_ROOT: /home/runner/.buildozer/android/platform/android-ndk-r25b
      run: |
        buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
